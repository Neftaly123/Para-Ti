<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe5ec" />
      <stop offset="50%" stop-color="#ffb3c1" />
      <stop offset="100%" stop-color="#ff758f" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf0" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Stars / Sparkles -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="80" cy="90" r="3" />
    <circle cx="140" cy="160" r="2" />
    <circle cx="480" cy="110" r="3.5" />
    <circle cx="520" cy="180" r="2" />
    <circle cx="320" cy="70" r="2.5" />
    <circle cx="210" cy="120" r="2" />
    <circle cx="420" cy="80" r="2.5" />
  </g>

  <!-- Moon / Sunset Glow -->
  <circle cx="300" cy="240" r="160" fill="url(#sunGlow)" />
  <circle cx="300" cy="240" r="100" fill="#fff9db" opacity="0.85" filter="url(#softGlow)" />

  <!-- Floating Hearts in sky -->
  <g fill="#ff4d6d" opacity="0.65">
    <path d="M 280,140 C 280,125 260,115 250,130 C 240,115 220,125 220,140 C 220,165 250,185 250,185 C 250,185 280,165 280,140 Z" transform="scale(0.6) translate(160, 40)" />
    <path d="M 280,140 C 280,125 260,115 250,130 C 240,115 220,125 220,140 C 220,165 250,185 250,185 C 250,185 280,165 280,140 Z" transform="scale(0.8) translate(130, 20)" />
    <path d="M 280,140 C 280,125 260,115 250,130 C 240,115 220,125 220,140 C 220,165 250,185 250,185 C 250,185 280,165 280,140 Z" transform="scale(0.45) translate(380, 100)" />
  </g>

  <!-- Gentle Hills -->
  <path d="M 0,480 Q 150,420 300,450 T 600,440 L 600,600 L 0,600 Z" fill="#590d22" opacity="0.35" />
  <path d="M 0,500 Q 200,460 400,490 T 600,480 L 600,600 L 0,600 Z" fill="#400b1a" opacity="0.6" />
  <path d="M 0,530 Q 300,500 600,530 L 600,600 L 0,600 Z" fill="#2b0913" />

  <!-- Bench -->
  <g stroke="#1a040b" stroke-width="5" stroke-linecap="round">
    <line x1="220" y1="480" x2="380" y2="480" stroke-width="8" />
    <line x1="230" y1="465" x2="370" y2="465" stroke-width="6" />
    <line x1="240" y1="480" x2="235" y2="525" />
    <line x1="360" y1="480" x2="365" y2="525" />
    <line x1="250" y1="465" x2="245" y2="480" />
    <line x1="350" y1="465" x2="355" y2="480" />
  </g>

  <!-- Silhouette of Couple Sitting Together -->
  <!-- Boy on Left -->
  <g fill="#1a040b">
    <!-- Boy Head -->
    <circle cx="275" cy="405" r="18" />
    <!-- Boy Body leaning slightly right -->
    <path d="M 260,425 C 260,420 270,418 280,418 C 290,418 295,423 295,430 L 290,480 L 265,480 Z" />
    <!-- Boy Arm around her -->
    <path d="M 265,435 Q 290,430 320,440" stroke="#1a040b" stroke-width="9" stroke-linecap="round" fill="none" />
    <line x1="270" y1="480" x2="265" y2="525" stroke="#1a040b" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Girl on Right (resting head on his shoulder) -->
  <g fill="#1a040b">
    <!-- Girl Hair and Head -->
    <circle cx="310" cy="415" r="16" />
    <path d="M 295,415 Q 315,400 328,425 Q 320,445 305,445 Z" />
    <!-- Girl Torso -->
    <path d="M 296,430 C 300,425 315,425 325,430 L 320,480 L 295,480 Z" />
    <!-- Girl Legs -->
    <line x1="310" y1="480" x2="315" y2="525" stroke="#1a040b" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Big Red Glowing Heart between / above them -->
  <g filter="url(#softGlow)">
    <path d="M 300,355 C 300,340 285,330 273,342 C 260,330 245,340 245,355 C 245,378 273,398 273,398 C 273,398 300,378 300,355 Z" fill="#ff1a4b" transform="scale(0.85) translate(50, 20)" />
  </g>

  <!-- Little Street Lamp on the right -->
  <g stroke="#1a040b" stroke-width="4">
    <line x1="420" y1="360" x2="420" y2="520" />
    <path d="M 420,380 Q 400,370 400,390" fill="none" stroke-width="3" />
    <!-- Lamp Head -->
    <polygon points="392,390 408,390 404,408 396,408" fill="#ffeaa7" stroke="#1a040b" stroke-width="2" />
    <!-- Lamp Light Glow -->
    <circle cx="400" cy="400" r="30" fill="#fff9db" opacity="0.3" filter="url(#softGlow)" stroke="none" />
  </g>

  <!-- Sweet Sparkles and Text hint -->
  <text x="300" y="565" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#ffb3c1" text-anchor="middle" letter-spacing="3">
    NUESTRA HISTORIA
  </text>
</svg>
